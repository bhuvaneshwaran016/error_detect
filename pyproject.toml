[project]
name = "orderflow-advanced-pytest-challenge"
version = "1.0.0"
description = "An intentionally buggy e-commerce backend for testing automated CI repair agents."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
